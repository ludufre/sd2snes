MEMORY {
    ROM:  start = $8000, size = $7FC0, type = ro, fill = yes, fillval = $00, file = %O;
    HDR:  start = $FFC0, size = $0024, type = ro, fill = yes, fillval = $00, file = %O;
    VECT: start = $FFE4, size = $001C, type = ro, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    CODE:    load = ROM,  type = ro;
    RODATA:  load = ROM,  type = ro;
    HEADER:  load = HDR,  type = ro;
    VECTORS: load = VECT, type = ro;
}
